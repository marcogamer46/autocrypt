[project]
name = "autocrypt"
dynamic = ["version"]
description = "CLI CTF crypto auto-solver: fingerprints unknown blobs and runs a best-first layered decode search over ciphers, encodings, and exact math attacks."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["ctf", "crypto", "cryptography", "cipher", "capture-the-flag", "automation", "cryptanalysis"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []  # stdlib only; optional crypto libs are never required

[project.scripts]
autocrypt = "autocrypt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["autocrypt"]

[tool.setuptools.package-data]
autocrypt = ["english_words.txt"]

[tool.setuptools.dynamic]
version = {attr = "autocrypt._version.__version__"}
