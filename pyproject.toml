[project]
name = "autocrypt"
version = "0.1.0"
description = "CLI CTF crypto auto-solver: fingerprints unknown blobs and runs a best-first layered decode search over ciphers, encodings, and exact math attacks."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["ctf", "crypto", "cryptography", "cipher", "capture-the-flag", "automation", "cryptanalysis"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []  # stdlib only; optional crypto libs are never required

[project.scripts]
autocrypt = "autocrypt:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "autocrypt", "core", "ui", "challenge", "scoring", "stego", "lattice",
    "czroots", "filetypes", "explain",
    "solvers", "solvers_extra", "solvers_mega", "solvers_more",
    "solvers_pack3", "solvers_pack5", "solvers_pack6", "solvers_pack7",
    "solvers_plus", "make_fixtures",
]
